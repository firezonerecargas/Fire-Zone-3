async function loadCfg(){const[a,b,c]=await Promise.all([sb.from('games').select('*').order('sort').order('id'),sb.from('offers').select('*').order('sort').order('price'),sb.from('settings').select('*')]);

function nav(){const t=[['home','🏠','Principal'],['ord','📦','Pedidos'],['wal','👛','Wallet']];if(me.is_admin)t.push(['adm','🛠','Admin']);$('#nav').innerHTML=t.map(([k,i,n])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${i}<small>${n}</small></button>`).join('')}

/* Juego */
function vGame(gid){const g=G.find(x=>x.id==gid);if(!g)return;const os=O.filter(o=>o.game_id==gid);
 $('#app').innerHTML=`<button class="ghost sm" onclick="go('home')">← Volver</button><div class="card hero" style="background:linear-gradient(135deg,${esc(g.color)}66,#120a1c)"><div class=fl>${esc(g.emoji)}</div><h2>${esc(g.name)}</h2><p>Elige tu recarga</p></div><div class=grid>${os.map((o,i)=>`<div class="card of" style="--i:${i}" onclick="pick(${o.id})"><div class=q>${esc(o.label)}</div><div class=pr>${o.price} CUP</div></div>`).join('')||'<p>Sin ofertas.</p>'}</div><h3 class=sec>⭐ Referencias</h3><div id=rv></div><a class=btn target=_blank href="https://wa.me/${esc(S.wa)}">💬 Soporte por WhatsApp</a>`;
 sb.from('reviews').select('*').order('created_at',{ascending:false}).limit(12).then(({data})=>{$('#rv').innerHTML=(data||[]).map(r=>`<div class=card><b>${esc(r.name)}</b> <span class=pe>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span><p>${esc(r.comment)}</p></div>`).join('')||'<p>Aún no hay referencias.</p>'})}
function pick(id){const o=O.find(x=>x.id==id),g=G.find(x=>x.id==o.game_id);modal(`<h3>${esc(g.name)} · ${esc(o.label)}</h3><p class=pe>${o.price} CUP</p><input id=ffid placeholder="${esc(g.id_label)}"><button class=btn onclick="cont(${id})">Continuar</button><button class=ghost onclick=closeM()>Cancelar</button>`)}
function cont(id){const pid=$('#ffid').value.trim(),o=O.find(x=>x.id==id),g=G.find(x=>x.id==o.game_id);if(pid.length<4)return T('ID inválido');
 if(me.balance<o.price)return modal(`<h3 class=no>❌ No tienes CUP</h3><p>Necesitas ${o.price} CUP y tienes ${me.balance} CUP.</p><button class=btn onclick="closeM();go('wal')">Depositar</button><button class=ghost onclick=closeM()>Cerrar</button>`);
 modal(`<h3>¿Quieres realizar el pedido?</h3><p>Juego: <b>${esc(g.name)}</b><br>ID: <b>${esc(pid)}</b><br>Oferta: <b>${esc(o.label)}</b><br>Precio: <b>${o.price} CUP</b></p><button class=btn onclick="buy(${id},this.dataset.p)" data-p="${esc(pid)}">Sí, realizar pedido</button><button class=ghost onclick=closeM()>Cancelar</button>`)}

/* Seguimiento */
const CIRCUIT=`<svg viewBox="0 0 300 120"><g fill=none stroke=currentColor stroke-width=2><path class=flow d="M10 60H70L90 30H150L170 90H230L250 60H290"/><path class=flow style="animation-delay:.5s" d="M10 100H60L80 80H140M160 20H220L240 40H290"/><path class=flow style="animation-delay:.9s" d="M10 20H50L70 40H110"/></g><g fill=currentColor><circle class=pulse cx=70 cy=60 r=5 /><circle class=pulse cx=150 cy=30 r=5 /><circle class=pulse cx=230 cy=90 r=5 /><circle class=pulse cx=290 cy=60 r=5 /><circle class=pulse cx=140 cy=80 r=4 /><circle class=pulse cx=220 cy=20 r=4 /></g></svg>`;

 const draw=async()=>{const{data:o}=await sb.from('orders').select('*').eq('id',id).single(),s=o.status;ov.dataset.s=s;

async function vWal(){await loadMe();const{data}=await sb.from('deposits').select('*').eq('user_id',me.id).order('id',{ascending:false});
 $('#app').innerHTML=`<div class=card><h3>${esc(me.name)}</h3><p>${esc(me.email)}</p></div><div class="card hero"><p>Tu billetera</p><h1 id=bal>0 CUP</h1><button class=btn onclick=dep()>Depositar</button></div><h3 class=sec>Depósitos</h3>${(data||[]).map(d=>`<div class=card><b>${d.amount} CUP</b> ${ST[d.status]}<p>${esc(d.method)} · ${new Date(d.created_at).toLocaleString()}</p></div>`).join('')||'<p>Sin depósitos.</p>'}<button class=ghost onclick=out()>Cerrar sesión</button>`;cnt($('#bal'),+me.balance)}

 const cp=t=>`<button class="ghost sm" onclick="navigator.clipboard.writeText('${String(t).replace(/\s/g,'')}');this.textContent='✔ Copiado'">Copiar</button>`;
 modal(`<h3>Realiza tu pago</h3>${mv?`<p>Número a enviar:</p><h3>${esc(S.movil)} ${cp(S.movil)}</h3><p>Monto: <b>${a} de saldo</b> (${cup} CUP)</p>`:`<p>Número de tarjeta:</p><h3>${esc(S.tarjeta)} ${cp(S.tarjeta)}</h3><p>Móvil a confirmar: <b>${esc(S.confirma)}</b></p><p>Monto: <b>${a} CUP</b></p>`}<p>Sube la captura del pago:</p><input id=fl type=file accept="image/*"><button class=btn onclick="depS('${m}',${a},${cup})">Realizar el pago</button><button class=ghost onclick=closeM()>Cancelar</button>`)}

 $('#app').insertAdjacentHTML('beforeend',await({cli:aCli,ped:aPed,dep:aDep,jue:aJue,aju:aAju,api:aApi})[at]())}
async function aCli(){const{data}=await sb.from('profiles').select('*').order('created_at',{ascending:false});
 return`<div class=card><h3>Enviar / quitar CUP</h3><input id=ce type=email placeholder="Correo del cliente"><input id=cm2 type=number placeholder="Monto (negativo para quitar)"><button class=btn onclick=adj()>Aplicar</button></div>`+data.map(c=>`<div class=card><b>${esc(c.name)}</b> ${c.is_admin?'🛡':''}${c.banned?'🚫':''}<p>${esc(c.email)} · ${esc(c.phone)}<br>${c.balance} CUP</p><button class="ghost sm" onclick="tog('${c.id}','is_admin',${!c.is_admin})">${c.is_admin?'Quitar admin':'Poner admin'}</button><button class="ghost sm" onclick="tog('${c.id}','banned',${!c.banned})">${c.banned?'Desbanear':'Banear'}</button></div>`).join('')}
async function tog(id,f,v){const{error}=await sb.from('profiles').update({[f]:v}).eq('id',id);error&&T(error.message);vAdm()}
async function adj(){const{error}=await sb.rpc('adjust_balance',{p_email:$('#ce').value.trim(),p_amount:+$('#cm2').value});error?T(error.message):T('Listo ✔');vAdm()}
async function aPed(){const[{data},{data:ap}]=await Promise.all([sb.from('orders').select('*,profiles(name,email)').order('id',{ascending:false}).limit(60),sb.from('apis').select('id,name')]);
 const op=(ap||[]).map(a=>`<option value=${a.id}>${esc(a.name)}</option>`).join('');
 return data.map(o=>`<div class=card><b>#${o.id} · ${esc(o.label||o.diamonds+' 💎')} · ${o.price} CUP</b> ${ST[o.status]}<p>${esc(o.game||'Free Fire')} · ID: <b>${esc(o.ff_id)}</b><br>${esc(o.profiles?.name)} · ${esc(o.profiles?.email)}</p>${o.status=='pending'?`<button class="btn sm" onclick="so(${o.id},'accepted')">Aceptar</button><button class="ghost sm" onclick="so(${o.id},'rejected')">Rechazar</button>`:''}${op?`<select id=s${o.id}>${op}</select><button class="ghost sm" onclick="sendApi(${o.id},$('#s${o.id}').value)">📡 Enviar a API</button>`:''}</div>`).join('')}
async function so(id,s){const{error}=await sb.rpc('set_order',{p_id:id,p_status:s});error&&T(error.message);vAdm()}
async function aDep(){const{data}=await sb.from('deposits').select('*,profiles(name,email)').order('id',{ascending:false}).limit(40);
 return data.map(d=>`<div class=card><b>${d.amount} CUP</b> ${ST[d.status]}<p>${esc(d.method)} (${esc(d.detail)})<br>${esc(d.profiles?.name)} · ${esc(d.profiles?.email)}</p><img class=pf src="${d.proof}">${d.status=='pending'?`<button class="btn sm" onclick="sd(${d.id},'accepted')">Aceptar</button><button class="ghost sm" onclick="sd(${d.id},'rejected')">Rechazar</button>`:''}</div>`).join('')}
async function sd(id,s){const{error}=await sb.rpc('set_deposit',{p_id:id,p_status:s});error&&T(error.message);vAdm()}

/* Juegos y ofertas editables */
const I=(t,id,f,v,ph)=>`<input value="${esc(v)}" placeholder="${ph}" onchange="upd('${t}',${id},'${f}',this.value)">`;
async function upd(t,id,f,v){if(v==='')v=null;const{error}=await sb.from(t).update({[f]:v}).eq('id',id);error?T(error.message):(T('Guardado ✔'),loadCfg())}
async function del(t,id){if(!confirm('¿Eliminar?'))return;const{error}=await sb.from(t).delete().eq('id',id);error&&T(error.message);await loadCfg();vAdm()}
async function addG(){const n=$('#gn').value.trim();if(!n)return T('Pon un nombre');const{error}=await sb.from('games').insert({name:n,emoji:$('#ge').value||'🎮',sort:G.length});error&&T(error.message);await loadCfg();vAdm()}
async function addO(g){const l=$('#ol'+g).value.trim(),p=$('#op'+g).value;if(!l||!p)return T('Falta nombre o precio');const{error}=await sb.from('offers').insert({game_id:g,label:l,qty:$('#oq'+g).value||null,price:p});error&&T(error.message);await loadCfg();vAdm()}
async function aJue(){return`<div class=card><h3>➕ Nuevo juego</h3><input id=gn placeholder="Nombre del juego"><input id=ge placeholder="Emoji (🎮)"><button class=btn onclick=addG()>Añadir juego</button></div>`+G.map(g=>`<div class=card><h3>${esc(g.emoji)} ${esc(g.name)}</h3>${I('games',g.id,'name',g.name,'Nombre')}${I('games',g.id,'emoji',g.emoji,'Emoji')}${I('games',g.id,'img',g.img||'','URL de imagen (opcional)')}<input type=color value="${esc(g.color)}" onchange="upd('games',${g.id},'color',this.value)">${I('games',g.id,'id_label',g.id_label,'Texto del campo ID')}<h4 style="margin-top:10px">Ofertas · nombre / cantidad / precio CUP</h4>${O.filter(o=>o.game_id==g.id).map(o=>`<div class=row>${I('offers',o.id,'label',o.label,'Nombre')}${I('offers',o.id,'qty',o.qty??'','Cant.')}${I('offers',o.id,'price',o.price,'CUP')}<button class="ghost sm" onclick="del('offers',${o.id})">🗑</button></div>`).join('')}<div class=row><input id=ol${g.id} placeholder="Ej: 110 Diamantes"><input id=oq${g.id} type=number placeholder="Cant."><input id=op${g.id} type=number placeholder="CUP"><button class="btn sm" onclick="addO(${g.id})">＋</button></div><button class="ghost sm" onclick="del('games',${g.id})">🗑 Eliminar juego</button></div>`).join('')}

/* Ajustes */
const aAju=()=>[['wa','WhatsApp de soporte (con código de país)'],['rate','CUP por cada 1 de saldo (multiplicador)'],['minSaldo','Mínimo de saldo móvil'],['minTransf','Mínimo transferencia (CUP)'],['movil','Número para Saldo Móvil'],['tarjeta','Tarjeta Bandec'],['confirma','Móvil a confirmar']].map(([k,l])=>`<div class=card><small>${l}</small><input value="${esc(S[k])}" onchange="sset('${k}',this.value)"></div>`).join('');
async function sset(k,v){const{error}=await sb.from('settings').upsert({key:k,value:v.trim()});error?T(error.message):(S[k]=v.trim(),SV('s',S),T('Guardado ✔'))}

/* API universal */
async function aApi(){const{data}=await sb.from('apis').select('*').order('id');
 return`<div class=card><h3>Vincular API de proveedor</h3><p>Usa {{ff_id}} {{game}} {{label}} {{diamonds}} {{order_id}} {{price}} {{api_key}} en URL, headers o body.</p><input id=an placeholder="Nombre del proveedor"><input id=au placeholder="URL (https://api.proveedor.com/order?key={{api_key}})"><select id=am2><option>POST</option><option>GET</option><option>PUT</option><option>PATCH</option></select><textarea id=ah rows=3>{"Content-Type":"application/json"}</textarea><textarea id=ab rows=4 placeholder='Body: {"player":"{{ff_id}}","package":"{{diamonds}}"}'></textarea><input id=ak placeholder="API key"><input id=ah2 placeholder="Header de la key (ej: Authorization) — opcional"><button class=btn onclick=saveApi()>Guardar API</button></div>`+data.map(a=>`<div class=card><b>${esc(a.name)}</b><p>${esc(a.method)} ${esc(a.url)}</p><button class="ghost sm" onclick="delApi(${a.id})">Eliminar</button></div>`).join('')}
async function saveApi(){const{error}=await sb.from('apis').insert({name:$('#an').value,url:$('#au').value,method:$('#am2').value,headers:$('#ah').value,body:$('#ab').value,api_key:$('#ak').value,key_header:$('#ah2').value||null});error&&T(error.message);vAdm()}
async function delApi(id){if(confirm('¿Eliminar?')){await sb.from('apis').delete().eq('id',id);vAdm()}}
const fill=(s,o,a)=>String(s||'').replace(/{{(\w+)}}/g,(_,k)=>({ff_id:o.ff_id,game:o.game,label:o.label,diamonds:o.diamonds,order_id:o.id,price:o.price,api_key:a.api_key})[k]??'');
async function sendApi(oid,aid){const[{data:o},{data:a}]=await Promise.all([sb.from('orders').select('*').eq('id',oid).single(),sb.from('apis').select('*').eq('id',aid).single()]);let h={};try{h=JSON.parse(fill(a.headers,o,a)||'{}')}catch{return T('Headers: JSON inválido')}
 if(a.key_header)h[a.key_header]=a.api_key;const m=a.method||'POST';try{const r=await fetch(fill(a.url,o,a),{method:m,headers:h,body:m=='GET'?undefined:fill(a.body,o,a)});alert('Respuesta '+r.status+'\n'+(await r.text()).slice(0,500))}catch(e){T('Error: '+e.message)}}

start();
</script></body></html>
